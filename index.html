<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Secrétaire des artisans</title>
<meta name="description" content="Le secrétaire administratif des artisans : documents chiffrés, relances de factures, échéances.">
<meta name="theme-color" content="#1D44B0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Secrétaire">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Plan : bleu de plan d'architecte + jaune chantier haute visibilité.
   Layout : une colonne téléphone, barre "Demande à Gaston" en vedette, onglets en bas. */
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --ink:#142033;
  --muted:#5A6781;
  --line:#D8DFEA;
  --plan:#1D44B0;
  --plan-soft:#E3EAFB;
  --plan-ink:#1D44B0;
  --on-plan:#FFFFFF;
  --lock-bg:#1D44B0;
  --plan-line:transparent;
  --vis:#F4C20D;
  --vis-ink:#1A1A12;
  --late:#B8321C;
  --late-soft:#FBE7E2;
  --soon:#9A6510;
  --soon-soft:#FBF0D9;
  --ok:#1C7A4B;
  --ok-soft:#DFF3E8;
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1322; --surface:#142038; --ink:#E8EEF9; --muted:#9AA9C4; --line:#24334F;
    --plan:#86A6FF; --plan-soft:#1B2C52; --plan-ink:#86A6FF; --on-plan:#0B1322; --lock-bg:#0E1D45; --vis:#F4C20D; --vis-ink:#1A1A12;
    --late:#FF8A73; --late-soft:#3A1E1C; --soon:#F0C063; --soon-soft:#3A2E17; --ok:#6FD7A0; --ok-soft:#163A2B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#142038; --ink:#E8EEF9; --muted:#9AA9C4; --line:#24334F;
  --plan:#86A6FF; --plan-soft:#1B2C52; --plan-ink:#86A6FF; --on-plan:#0B1322; --lock-bg:#0E1D45; --vis:#F4C20D; --vis-ink:#1A1A12;
  --late:#FF8A73; --late-soft:#3A1E1C; --soon:#F0C063; --soon-soft:#3A2E17; --ok:#6FD7A0; --ok-soft:#163A2B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plan-ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);font-stretch:88%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:10px;display:block;flex:none}
.brand b{font-family:var(--font-display);font-weight:800;font-size:20px;font-stretch:85%}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.1}
.lockbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

/* Barre "Demande à Gaston" : l'élément vedette */
.ask{position:relative;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);padding:14px 14px 12px 22px;overflow:hidden}
.ask::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(-45deg,var(--vis) 0 8px,var(--vis-ink) 8px 16px)}
.ask h2{font-size:22px;font-weight:800;margin-bottom:10px}
.askform{display:flex;gap:8px}
.askform input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px 12px;font-size:16px;outline:none}
.askform input:focus{border-color:var(--plan)}
.askform button{border:0;background:var(--plan);color:var(--on-plan);box-shadow:inset 0 0 0 2px var(--plan-line);border-radius:var(--r-md);padding:0 16px;font-weight:700;display:flex;align-items:center;gap:6px}
.askform .micbtn{background:var(--vis);color:var(--vis-ink)!important;padding:0 13px}
.askform .micbtn.listening{background:var(--late);color:#fff!important;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,50,28,.45)}50%{box-shadow:0 0 0 8px rgba(184,50,28,0)}}
.demochk{display:flex;gap:10px;align-items:center;margin-top:18px;font-size:14.5px;color:#fff;cursor:pointer}
.demochk input{width:20px;height:20px;accent-color:var(--vis)}
.mictip{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soon-soft);color:var(--ink);font-size:14px;line-height:1.35}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip:hover{border-color:var(--plan)}
.chip.on{background:var(--plan);border-color:var(--plan-line);color:var(--on-plan)}

.answer{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;animation:rise .22s ease-out}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer p{margin:0 0 10px}

/* Tuiles argent */
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:27px;font-stretch:80%;line-height:1.05;margin-top:4px}
.tile.win{background:var(--plan);border-color:var(--plan);color:var(--on-plan);box-shadow:inset 0 0 0 2px var(--plan-line)}
.tile.win .muted{color:var(--on-plan);opacity:.8}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 0}
.sec-h h3{font-size:18px;font-weight:700}
.link{background:none;border:0;color:var(--plan-ink);font-weight:700;padding:4px 2px;font-size:14.5px}

/* Listes */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--bg)}
.ico{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--plan-soft);color:var(--plan-ink)}
.item .t{font-weight:700;line-height:1.25}
.item .s{color:var(--muted);font-size:13.5px;line-height:1.3;margin-top:2px}
.grow{flex:1;min-width:0}
.amt{font-family:var(--font-display);font-weight:700;font-stretch:85%;font-size:17px;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.p-late{background:var(--late-soft);color:var(--late)}
.p-soon{background:var(--soon-soft);color:var(--soon)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-info{background:var(--plan-soft);color:var(--plan-ink)}
.stripe{width:4px;align-self:stretch;border-radius:3px;flex:none}
.st-late{background:var(--late)}.st-soon{background:var(--soon)}.st-ok{background:var(--ok)}.st-info{background:var(--plan)}

.btn{border:0;border-radius:var(--r-md);padding:12px 14px;font-weight:700;white-space:nowrap;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--plan);color:var(--on-plan);box-shadow:inset 0 0 0 2px var(--plan-line)}
.btn-s{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-vis{background:var(--vis);color:var(--vis-ink)}
.btn-d{background:var(--late-soft);color:var(--late)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}

/* Navigation */
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11.5px;border-radius:10px}
nav.tabs button.on{color:var(--plan-ink);font-weight:700}
nav.tabs button.on svg{stroke-width:2.4}

/* Feuille modale */
.sheet-bg{position:absolute;inset:0;background:rgba(9,16,30,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px 22px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:4px}

/* Aperçu document */
.paper{background:#FFFFFF;color:#1B2433;border-radius:10px;border:1px solid #D8DFEA;padding:18px 16px;margin:14px 0;box-shadow:0 1px 0 #D8DFEA,0 8px 22px rgba(20,32,51,.08);font-size:14px}
.paper .hd{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #1D44B0;padding-bottom:10px;margin-bottom:12px}
.paper .iss{font-family:var(--font-display);font-weight:800;font-stretch:85%;font-size:15px;color:#1D44B0}
.paper .ttl{font-family:var(--font-display);font-weight:800;font-size:19px;font-stretch:88%;margin-bottom:10px}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.paper dt{color:#5A6781}
.paper dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.paper .demo{margin-top:12px;font-size:12px;color:#7A869C}
.paper img{width:100%;border-radius:6px;display:block}

/* Écran de verrouillage */
.lock{position:absolute;inset:0;z-index:40;background:var(--lock-bg);color:#fff;display:flex;flex-direction:column;align-items:center;padding:34px 22px 22px;overflow-y:auto}
.lock .hz{position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,var(--vis) 0 10px,var(--vis-ink) 10px 20px)}
.lock h1{font-size:34px;font-weight:800;font-stretch:80%;margin-top:18px;text-align:center}
.lock p{margin:8px 0 0;text-align:center;max-width:34ch;color:rgba(255,255,255,.86)}
.dots{display:flex;gap:14px;margin:26px 0 8px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.75)}
.dot.f{background:var(--vis);border-color:var(--vis)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:16px}
.pad button{height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.13);color:#fff;font-family:var(--font-display);font-size:26px;font-weight:600;font-stretch:85%}
.pad button:active{background:rgba(255,255,255,.3)}
.pad .ghost{background:none;font-size:14px;font-family:var(--font-body)}
.lockmsg{min-height:22px;margin-top:6px;font-weight:700;color:var(--vis)}
.lock .fine{font-size:13px;color:rgba(255,255,255,.72);margin-top:18px}
.lock .busy{margin-top:14px;font-size:14px;color:rgba(255,255,255,.9)}

.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:60;max-width:90%;text-align:center;animation:rise .2s ease-out}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:14px;font-weight:700}
.field input,.field select,.field textarea{border:2px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:11px 12px;font-size:16px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--plan)}
.field textarea{min-height:190px;resize:vertical;line-height:1.45;font-size:15px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{position:relative;width:48px;height:28px;flex:none;border-radius:999px;background:var(--line);border:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.cipher{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:120px;overflow:hidden;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check svg{flex:none;margin-top:2px;color:var(--ok)}
.month{font-family:var(--font-display);font-weight:700;font-stretch:85%;font-size:15px;color:var(--muted);margin:8px 2px -4px;text-transform:capitalize}
.drop{border:2px dashed var(--line);border-radius:var(--r-lg);padding:18px;text-align:center;background:var(--surface);display:block;cursor:pointer}
.drop:hover{border-color:var(--plan)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.timeline{display:flex;gap:6px;margin-top:10px}
.timeline span{flex:1;font-size:12px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.timeline span.done{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:700}
.timeline span.next{background:var(--soon-soft);color:var(--soon);border-color:transparent;font-weight:700}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.swatch{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--ink)}
.swatch i{width:28px;height:28px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.swatch[aria-pressed="true"]{border-color:var(--plan-ink);box-shadow:0 0 0 2px var(--plan-soft)}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.aibadge{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:11.5px;font-stretch:90%;background:var(--vis);color:var(--vis-ink);border-radius:6px;padding:1px 6px;vertical-align:2px;margin-right:2px}
.reading{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:var(--plan-soft);color:var(--plan-ink);font-weight:700}
.reading i{width:16px;height:16px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand"><svg class="mark" width="38" height="38" viewBox="0 0 240 240" aria-hidden="true"><rect width="240" height="240" rx="54" fill="#0E1D45"/><g transform="translate(0 7)"><defs><pattern id="hzTop" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="22" height="22" fill="#F4C20D"/><rect width="9" height="22" fill="#1A1A12"/></pattern></defs>

<script>
(function(){
"use strict";

/* ---------- Utilitaires ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’'`]/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const eur = n => n.toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2 = n => n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const DAY = 86400000;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => new Date(d.getTime()+n*DAY);
const iso = d => { const z=new Date(d); return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"); };
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };

/* ---------- Coffre chiffré (AES-256-GCM, clé dérivée du code) ---------- */
const STORE = "gaston.vault.v1";
let RAW = null, IDB = null;
function idbOpen(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("secretaire",1);
      r.onupgradeneeded = ()=>r.result.createObjectStore("kv");
      r.onsuccess = ()=>{ IDB=r.result; res(true); };
      r.onerror = ()=>res(false);
    }catch(e){ res(false); }
  });
}
function idbDo(mode, fn){
  return new Promise((res,rej)=>{
    if(!IDB) return rej(new Error("no-idb"));
    try{ const tx=IDB.transaction("kv",mode); const st=tx.objectStore("kv"); const rq=fn(st); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }catch(e){ rej(e); }
  });
}
async function loadStore(){
  await idbOpen();
  try{ RAW = (await idbDo("readonly", st=>st.get(STORE))) || null; }catch(e){ RAW=null; }
  if(!RAW){ try{ RAW = localStorage.getItem(STORE); }catch(e){} }
}
const store = {
  get(){ return RAW; },
  async set(v){
    try{ await idbDo("readwrite", st=>st.put(v,STORE)); RAW=v; return; }catch(e){}
    try{ localStorage.setItem(STORE,v); RAW=v; }catch(e){ throw new Error("quota"); }
  },
  del(){ RAW=null; idbDo("readwrite", st=>st.delete(STORE)).catch(()=>{}); try{ localStorage.removeItem(STORE); }catch(e){} }
};
let KEY=null, SALT=null, S=null, lastCipher="";

async function deriveKey(code, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"}, base, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
}
async function persist(){
  if(!KEY) return;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv}, KEY, new TextEncoder().encode(JSON.stringify(S)));
  lastCipher = b64(ct);
  await store.set(JSON.stringify({v:1,salt:b64(SALT),iv:b64(iv),ct:lastCipher}));
}
async function openVault(code, useDemo, useOfficial){
  const raw = store.get();
  if(!raw){
    SALT = crypto.getRandomValues(new Uint8Array(16));
    KEY = await deriveKey(code, SALT);
    S = useDemo ? demoState() : emptyState(useOfficial);
    await persist();
    return true;
  }
  const box = JSON.parse(raw);
  SALT = unb64(box.salt);
  const k = await deriveKey(code, SALT);
  try{
    const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)}, k, unb64(box.ct));
    KEY = k; S = JSON.parse(new TextDecoder().decode(pt)); lastCipher = box.ct;
    if(!Array.isArray(S.deadlines)) S.deadlines = [];
    return true;
  }catch(e){ return false; }
}

async function press(k){
  if(busy || !k) return;
  const msg=$("#lockmsg");
  if(k==="del"){ pin=pin.slice(0,-1); }
  else if(k==="reset"){
    if(!store.get()) return;
    msg.innerHTML = `Sans ton code, personne ne peut ouvrir le coffre. <button type="button" id="wipe" style="background:none;border:0;color:#fff;text-decoration:underline;font-weight:700">Tout effacer et recommencer</button>`;
    $("#wipe").onclick = ()=>{ store.del(); $("#lock").remove(); showLock(); };
    return;
  }
  else if(pin.length<6){ pin+=k; }
  drawDots();
  if(pin.length===6){
    busy=true; msg.textContent="Ouverture du coffre…";
    const useDemo = !!($("#demo") && $("#demo").checked);
    const useOfficial = !!($("#official") && $("#official").checked);
    const ok = await openVault(pin, useDemo, useOfficial).catch(()=>false);

    else { msg.textContent="Code incorrect. Réessaie."; const d=$("#dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); pin=""; drawDots(); }

}

/* ---------- Assistant (compréhension du langage) ---------- */
const STOP = new Set("sors sort sortir moi mon ma mes le la les de du des un une montre montrer trouve trouver donne donner affiche afficher envoie je j veux voudrais cherche chercher stp svp s il te plait plais dernier derniere derniers dernieres recent recente l d a au aux et ou est quoi ou se sur pour avec mon ou ce cette ces qu que qui as tu peux pourrais ouvre ouvrir besoin il me faut retrouve retrouver".split(" "));
const SUGGEST = ["Sors-moi mon dernier avis d'imposition","Qui me doit de l'argent ?","Ma prochaine échéance","Mon attestation décennale","Combien tu m'as fait récupérer ?","Mon RIB"];
function ask(q){
  const n = norm(q);
  if(!n) return null;
  if(/(qui me doit|me doi|impaye|pas paye|pas encore paye|a encaisser|en retard|argent dehors|creance|relanc)/.test(n)) return {kind:"unpaid", q};
  if(/(recupere|fait gagner|combien.*(secretaire|recup|m as fait)|economi)/.test(n)) return {kind:"recovered", q};
  if(/(echeance|date limite|a payer bientot|a faire|prochaine|deadline|rappel)/.test(n) && !/(avis|attestation|carte|rib|contrat|devis|certificat)/.test(n)) return {kind:"deadlines", q};
  const years = (n.match(/\b(20\d\d)\b/g)||[]).map(Number);
  const toks = n.split(" ").filter(t=>t.length>1 && !STOP.has(t) && !/^20\d\d$/.test(t));
  const latest = /(dernier|derniere|recent|plus recent|actuel)/.test(n);
  // factures par client
  const invHits = S.inv.filter(i=>toks.some(t=>t.length>2 && norm(i.client+" "+i.num).split(" ").some(w=>w.startsWith(t))));
  const scored = S.docs.map(doc=>{
    const hay = norm([doc.title,doc.kw,doc.issuer,catOf(doc.cat).label,(doc.fields||[]).map(f=>f.join(" ")).join(" ")].join(" ")).split(" ");
    let sc=0;
    toks.forEach(t=>{
      if(hay.includes(t)) sc+=2;
      else if(t.length>=4 && hay.some(w=>w.startsWith(t.slice(0,Math.max(4,t.length-2))))) sc+=1;
    });
    if(years.length && sc>0){ if(years.some(y=>doc.title.includes(String(y))||doc.date.startsWith(String(y)))) sc+=2; else sc-=1; }
    return {doc,sc};
  }).filter(x=>x.sc>0).sort((a,b)=> b.sc-a.sc || b.doc.date.localeCompare(a.doc.date));
  if(invHits.length && (/factur|paie|paye|doit/.test(n) || !scored.length)) return {kind:"invoices", list:invHits, q};
  if(!scored.length) return {kind:"none", q};
  const top = scored[0].sc;
  const best = scored.filter(x=>x.sc>=top-1).map(x=>x.doc);
  const weak = top<=1 || (toks.length>=3 && top<=2);
  return {kind:"docs", list:best, latest, weak, q};
}

  }
  if(a.kind==="invoices") return `<div class="answer"><p>J'ai trouvé ${a.list.length} facture${a.list.length>1?"s":""} :</p>${billList(a.list)}</div>`;
  if(a.kind==="none") return `<div class="answer"><p>Je n'ai rien trouvé pour « ${esc(a.q)} ». Essaie avec un autre mot (par exemple « URSSAF », « carte grise », « devis ») ou ajoute le document.</p><div class="btns"><button type="button" class="btn btn-s" data-act="add">${ico("camera",18)}Ajouter un document</button></div></div>`;
  const d=a.list[0];
  const more=a.list.slice(1);
  return `<div class="answer"><p>Voilà ${a.latest||a.list.length===1?"":"ce que j'ai de plus récent : "}<b>${esc(d.title)}</b>, du ${fmtDate(d.date)}.</p>

    <div class="btns"><button type="button" class="btn btn-p" data-doc="${d.id}">Ouvrir</button><button type="button" class="btn btn-s" data-copydoc="${d.id}">${ico("copy",18)}Copier les infos</button></div>

}

const GUESS = [
  [/(impot|imposition|dgfip|fiscal|cfe|taxe)/,"impots"],[/(urssaf|vigilance|cotisation)/,"urssaf"],[/(assur|decennale|rc ?pro|mutuelle)/,"assurances"],
  [/(carte ?grise|vehicule|camion|kangoo|controle ?tech)/,"vehicule"],[/(rib|iban|banque|releve)/,"banque"],[/(devis|facture|client)/,"clients"],[/(kbis|siret|sirene|insee|qualibat|rge)/,"entreprise"]
];
async function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  const name=f.name.replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ");
  const n=norm(name); let cat="entreprise"; for(const [re,c] of GUESS){ if(re.test(n)){ cat=c; break; } }
  let img=null, pdf=null, blob=null, ext=null;
  try{
    if(f.type.startsWith("image/")){ const r=await shrink(f); img=r.url; blob=r.blob; }
    else if(f.type==="application/pdf"){ if(f.size>8*1024*1024){ toast("Ce PDF dépasse 8 Mo. Compresse-le ou prends une photo à la place."); return; } pdf = await readURL(f); }
    else { toast("Format non pris en charge. Choisis une image ou un PDF."); return; }
  }catch(err){ toast("Impossible de lire ce fichier. Essaie avec une autre photo."); return; }
  $("#addform").innerHTML = `

    <div class="field"><label for="dcat">Rangé dans</label><select id="dcat">${CATS.map(c=>`<option value="${c.id}" ${c.id===cat?"selected":""}>${c.label}</option>`).join("")}</select></div>
    <div class="field"><label for="ddate">Date du document</label><input id="ddate" type="date" value="${iso(today())}"></div>
    <button type="button" class="btn btn-p" style="width:100%;margin-top:14px" id="savedoc">${ico("lock",18)}Chiffrer et ranger</button>`;
  $("#savedoc").onclick = async ()=>{
    const title=$("#dtitle").value.trim()||"Document";
    const fields = ext && Array.isArray(ext.infos) ? ext.infos.filter(x=>Array.isArray(x)&&x.length>=2).slice(0,5).map(x=>[String(x[0]),String(x[1])]) : [];
    const doc={id:uid(),cat:$("#dcat").value,title,issuer:(ext&&ext.emetteur)||"Ajouté par toi",date:$("#ddate").value||iso(today()),kw:norm(title+" "+fields.map(x=>x.join(" ")).join(" ")),fields,summary:ext&&ext.resume?String(ext.resume):"",mine:true,img,pdf,pdfName:pdf?f.name:null};
    S.docs.push(doc);
    const addDl = $("#adddl") && $("#adddl").checked && ext && ext.echeance;
    if(addDl) S.deadlines.push({id:uid(),title:String(ext.echeance.titre||"À faire"),what:"Repéré dans : "+title,date:ext.echeance.date,cat:doc.cat});
    try{ await persist(); }catch(err){ S.docs.pop(); toast("La mémoire de ton téléphone pour l'appli est pleine. Supprime un document ou choisis une image plus légère."); return; }
    closeSheet(); toast("Document chiffré et rangé dans "+catOf(doc.cat).label+(addDl?", échéance ajoutée":"")); render();
  };
}
function readURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function shrink(f){
  const url = await readURL(f);
  const im = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const max=1400, sc=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement("canvas"); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  const blob = await new Promise(res=>c.toBlob(res,"image/jpeg",0.78));
  return {url:c.toDataURL("image/jpeg",0.78), blob};
}

let REC=null;
function listen(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const q=$("#q");
  if(!SR){
    q.focus();
    if(!$("#mictip")){ const tip=document.createElement("div"); tip.id="mictip"; tip.className="mictip"; tip.setAttribute("role","status");

      $("#askform").after(tip); setTimeout(()=>tip.remove(),9000); }
    return;
  }
  if(REC){ REC.stop(); return; }
  REC = new SR(); REC.lang="fr-FR"; REC.interimResults=true; REC.maxAlternatives=1;
  btn.classList.add("listening"); btn.setAttribute("aria-label","Arrêter l'écoute");
  const ph=q.placeholder; q.placeholder="Je t'écoute…"; q.value="";
  REC.onresult = e=>{ let txt=""; for(const r of e.results) txt+=r[0].transcript; q.value=txt; };
  REC.onerror = ev=>{
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed") toast("Autorise le micro pour ce site dans les réglages de ton navigateur.");
    else if(ev.error==="no-speech") toast("Je n'ai rien entendu. Appuie sur le micro et parle.");
    else if(ev.error!=="aborted") toast("La dictée a coupé. Réessaie.");
  };
  REC.onend = ()=>{ REC=null; const b=$(".micbtn"); if(b){ b.classList.remove("listening"); b.setAttribute("aria-label","Parler au Secrétaire"); } const qq=$("#q"); if(qq){ qq.placeholder=ph; if(qq.value.trim()) runAsk(qq.value); } };
  try{ REC.start(); }catch(e){ REC=null; btn.classList.remove("listening"); }
}

    <div class="field"><label for="dlt">Quoi ?</label><input id="dlt" placeholder="Ex. : Renouveler la carte pro"></div>
    <div class="field"><label for="dld">Pour quand ?</label><input id="dld" type="date" value="${iso(addDays(today(),14))}"></div>
    <div class="field"><label for="dlc">Catégorie</label><select id="dlc">${CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join("")}</select></div>
    <div id="dlerr" class="small" style="color:var(--late);font-weight:700;margin-top:8px" role="alert"></div>
    <button type="button" class="btn btn-p" style="width:100%;margin-top:12px" id="savedl">Ajouter</button>`, "Nouvelle échéance");
  $("#savedl").onclick = async ()=>{
    const t=$("#dlt").value.trim(); if(!t){ $("#dlerr").textContent="Écris ce qu'il faut faire."; return; }
    S.deadlines.push({id:uid(),title:t,what:"Ajoutée par toi",date:$("#dld").value||iso(today()),cat:$("#dlc").value});
    await persist(); closeSheet(); toast("Échéance ajoutée. Je te le rappellerai."); render();
  };
}

/* ---------- Toast & copie ---------- */
let toastT;
function toast(t){ clearTimeout(toastT); const old=$(".toast"); if(old) old.remove(); const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; $("#app").appendChild(el); toastT=setTimeout(()=>el.remove(),2600); }
async function copy(txt){ try{ await navigator.clipboard.writeText(txt); toast("Copié"); }catch(e){ toast("Copie impossible ici. Sélectionne le texte et copie-le."); } }

/* ---------- Événements ---------- */
$("#app").addEventListener("submit", e=>{
  if(e.target.id==="askform"){ e.preventDefault(); runAsk($("#q").value); }
});
$("#app").addEventListener("click", async e=>{
  const t=e.target.closest("button,[data-doc],[data-inv]"); if(!t || !S) return;
  const ds=t.dataset;
  if(ds.ask){ $("#q").value=ds.ask; runAsk(ds.ask); return; }
  if(ds.go){ go(ds.go); return; }
  if(ds.doc){ docSheet(ds.doc); return; }
  if(ds.inv){ invSheet(ds.inv); return; }
  if(ds.filter){ docFilter=ds.filter; render(); return; }
  if(ds.bf){ billFilter=ds.bf; render(); return; }
  if(ds.copydoc){ const d=S.docs.find(x=>x.id===ds.copydoc); copy(d.title+"\n"+(d.fields||[]).map(f=>f[0]+" : "+f[1]).join("\n")); return; }
  if(ds.copymsg){ copy($("#msg").value); return; }
  if(ds.lvl){ invSheet(ds.invLvl, Number(ds.lvl)); return; }
  if(ds.autoinv){ const i=S.inv.find(x=>x.id===ds.autoinv); i.auto=!i.auto; await persist(); invSheet(i.id); toast(i.auto?"Relances automatiques activées":"Relances automatiques coupées"); return; }
  if(ds.sendinv){
    const i=S.inv.find(x=>x.id===ds.sendinv);
    if(!/@/.test(i.email||"")){ toast("Il manque l'e-mail de ce client. Envoie la relance par SMS."); return; }
    const lvl=Number(ds.lvlsend||1);
    const subject = lvl===3 ? `Mise en demeure de payer, facture ${i.num}` : `Facture ${i.num} : rappel de paiement`;
    const body = $("#msg").value.replace(/^Objet :[^\n]*\n+/,"");
    i.sent.push(iso(today())); await persist();
    window.location.href = `mailto:${encodeURIComponent(i.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    closeSheet(); toast("Ta messagerie s'ouvre. Appuie sur Envoyer."); render(); return;
  }
  if(ds.smsinv){
    const i=S.inv.find(x=>x.id===ds.smsinv);
    const body = $("#msg").value.replace(/^Objet :[^\n]*\n+/,"");
    i.sent.push(iso(today())); await persist();
    window.location.href = `sms:${encodeURIComponent(i.phone||"")}?body=${encodeURIComponent(body)}`;
    closeSheet(); toast("Tes SMS s'ouvrent avec le message prêt."); render(); return;
  }
  if(ds.paid){ const i=S.inv.find(x=>x.id===ds.paid); i.status="paid"; i.paidOn=iso(today()); i.byGaston=i.sent.length>0; await persist(); closeSheet(); toast(i.byGaston?`+${eur(i.amount)} récupérés grâce aux relances`:"Facture marquée comme payée"); render(); return; }
  if(ds.themeSet){ PREFS.theme=ds.themeSet; savePrefs(); render(); return; }
  if(ds.accentSet){ PREFS.accent=ds.accentSet; savePrefs(); render(); return; }
  if(ds.dl){ dlSheet(ds.dl); return; }
  if(ds.deldoc){ const id=ds.deldoc; confirmSheet("Supprimer ce document ?","Il sera effacé de ton coffre. C'est définitif.","Supprimer", async ()=>{ S.docs=S.docs.filter(x=>x.id!==id); await persist(); closeSheet(); toast("Document supprimé"); if(lastAnswer&&lastAnswer.kind==="docs"){ lastAnswer=null; } render(); }); return; }
  if(ds.delinv){ const id=ds.delinv; confirmSheet("Supprimer cette facture ?","Elle ne sera plus suivie et les relances s'arrêtent. C'est définitif.","Supprimer", async ()=>{ S.inv=S.inv.filter(x=>x.id!==id); await persist(); closeSheet(); toast("Facture supprimée"); render(); }); return; }
  if(ds.deldl){ const id=ds.deldl; confirmSheet("Supprimer cette échéance ?","Tu ne recevras plus de rappel pour elle.","Supprimer", async ()=>{ S.deadlines=S.deadlines.filter(x=>x.id!==id); await persist(); closeSheet(); toast("Échéance supprimée"); render(); }); return; }
  if(ds.donedl){ S.deadlines=S.deadlines.filter(x=>x.id!==ds.donedl); await persist(); closeSheet(); toast("Bien joué, une chose de moins à faire"); render(); return; }
  switch(ds.act){
    case "mic": listen(t); break;
    case "profile": profileSheet(false); break;
    case "export": exportBackup(); break;
    case "add": addDocSheet(); break;
    case "newinv": newInvSheet(); break;
    case "newdl": newDlSheet(); break;
    case "official": { const have=new Set(S.deadlines.map(x=>x.title)); buildDeadlines(false).forEach(x=>{ if(!have.has(x.title)) S.deadlines.push(x); }); await persist(); render(); toast("Rappels des micro-entrepreneurs ajoutés"); break; }
    case "close": closeSheet(); break;
    case "lock": lock(); break;
    case "toggleRem": S.reminders=!S.reminders; await persist(); render(); toast(S.reminders?"Rappels activés":"Rappels coupés"); break;
    case "wipe":
      openSheet(`<h2>Effacer toutes tes données ?</h2><p class="muted">Tous les documents, factures et échéances de ce téléphone seront supprimés. C'est définitif.</p><div class="btns"><button type="button" class="btn btn-d" data-act="wipeok">Tout effacer</button><button type="button" class="btn btn-s" data-act="close">Annuler</button></div>`,"Effacer les données");
      break;
    case "wipeok": store.del(); KEY=null; S=null; closeSheet(); $("#main").innerHTML=""; showLock(); break;
  }
});

$("#app").addEventListener("change", e=>{ if(e.target.id==="importf" && e.target.files[0]) importBackup(e.target.files[0]); });

/* ---------- Démarrage ---------- */
if(!window.crypto || !crypto.subtle){
  $("#main").innerHTML = `<div class="card" style="margin-top:20px"><b>Ce navigateur ne permet pas le chiffrement.</b><p class="muted">Ouvre le Secrétaire avec un navigateur récent (Safari, Chrome, Firefox) pour protéger tes documents.</p></div>`;
} else { loadStore().then(showLock); }
if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
</body>
</html>
